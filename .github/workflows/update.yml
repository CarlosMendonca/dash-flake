name: update

# Regenerate data/*.json from Google's archives so new Dart/Flutter releases
# become available as packages within ~a day of upstream publishing them.
on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Regenerate version data
        run: nix run .#update

      - name: Sanity-check the flake still evaluates
        run: nix flake check --all-systems

      # Build + run the latest stable Dart and Flutter against the freshly
      # regenerated data, so a broken refresh fails this job *before* anything
      # is pushed. Mirrors check.yml's Linux coverage. This is the gate: if any
      # step above fails the job stops here and main is never touched.
      - name: Build latest Dart
        run: nix build .#dart --print-build-logs && ./result/bin/dart --version

      # buildFHSEnv runs Flutter inside bubblewrap, which needs unprivileged
      # user namespaces; ubuntu-24.04 runners block those via AppArmor by
      # default, so lift the restriction before entering the FHS sandbox.
      - name: Allow unprivileged user namespaces (bwrap/FHS)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build + run latest Flutter
        run: nix build .#flutter --print-build-logs && nix run .#flutter -- --version

      # No PR: push the refreshed data straight to main. Validation above has
      # already passed, and a push by GITHUB_TOKEN doesn't re-trigger check.yml
      # (GITHUB_TOKEN events don't start workflows), so there's no redundant CI.
      - name: Commit & push data changes
        run: |
          if git diff --quiet -- data/dart.json data/flutter.json; then
            echo "No new Dart/Flutter versions; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dart.json data/flutter.json
          git commit -m "data: refresh Dart/Flutter versions"
          git push origin HEAD:main
